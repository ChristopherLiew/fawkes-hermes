name: ci

# Runs on every PR and every push to main. It never touches Fly and holds no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: secret scan + hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install gitleaks (pinned version + checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f "$f" gitleaks
      - run: pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: single-author commits (no Co-Authored-By trailers)
        run: |
          if git log --format=%B | grep -iqE '^co-authored-by:'; then
            echo "::error::Co-Authored-By trailer found in history; commits must have the repo owner as sole author"; exit 1
          fi
      - name: gitleaks over full history
        run: pre-commit run gitleaks-history --hook-stage manual --all-files

  skills:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_skills.py skills
      - run: shellcheck scripts/sync-skills.sh

  infra:
    name: fly.toml image pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check-image (skipped until fly.toml exists)
        run: |
          if [ -f fly.toml ]; then make check-image; else echo "no fly.toml yet"; fi
