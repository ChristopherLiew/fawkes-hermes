name: deploy-skills

# CD for skills only. It publishes skills/ at the exact commit that passed validation.
# It never runs `fly deploy`; infra deploys stay manual (docs/CICD.md).
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/sync-skills.sh"
      - "tests/**"
      - ".github/workflows/deploy-skills.yml"
  workflow_dispatch: # manual re-sync from the Actions tab

permissions:
  contents: read

concurrency:
  group: fly-fawkes-hermes # shared with deploy-infra: never sync and deploy at the same time
  cancel-in-progress: false # never interrupt a sync halfway

env:
  FLY_APP: fawkes-hermes

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_skills.py skills
      - run: python3 -m unittest discover -s tests # stdlib only; the YAML check runs in ci.yml
      - run: shellcheck scripts/sync-skills.sh scripts/require-merged-pr.sh

  gate:
    name: merged-PR gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit is a merged PR into main with green ci
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/require-merged-pr.sh

  deploy:
    needs: [validate, gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # FLY_API_TOKEN lives here, restricted to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: FLY_API_TOKEN configured?
        id: token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::FLY_API_TOKEN is not set in the production environment yet (GO_LIVE step 8.3); skipping sync"
            echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        if: steps.token.outputs.ok == 'true'
      - name: Sync skills (script streamed in; never stored on the volume)
        if: steps.token.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REPO: git@github.com:${{ github.repository }}.git
          REF: ${{ github.sha }}
        run: |
          B64=$( { printf 'REPO=%s\nREF=%s\n' "$REPO" "$REF"; cat scripts/sync-skills.sh; } | base64 -w0 )
          # Absolute paths: root's PATH on the machine includes agent-writable /opt/data/.local/bin
          flyctl ssh console -a "$FLY_APP" -C "/bin/sh -c \"echo $B64 | /usr/bin/base64 -d | /bin/sh\""
      - name: Verify published revision
        if: steps.token.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          got=$(flyctl ssh console -a "$FLY_APP" -C "/bin/cat /opt/data/skills-repo/.revision" | tr -d '\r\n ')
          want=$(git rev-parse --short HEAD)
          echo "published=$got expected=$want"
          [ "$got" = "$want" ]
