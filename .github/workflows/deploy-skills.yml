name: deploy-skills

# CD for skills only. It publishes skills/ at the exact commit that passed validation.
# It never runs `fly deploy`; infra deploys stay manual (docs/CICD.md).
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/sync-skills.sh"
      - ".github/workflows/deploy-skills.yml"
  workflow_dispatch: # manual re-sync from the Actions tab

permissions:
  contents: read

concurrency:
  group: fly-hermes-me # shared with deploy-infra: never sync and deploy at the same time
  cancel-in-progress: false # never interrupt a sync halfway

env:
  FLY_APP: hermes-me

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate_skills.py skills
      - run: shellcheck scripts/sync-skills.sh

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # FLY_API_TOKEN lives here, restricted to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Sync skills (script streamed in; never stored on the volume)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REPO: git@github.com:${{ github.repository }}.git
          REF: ${{ github.sha }}
        run: |
          B64=$( { printf 'REPO=%s\nREF=%s\n' "$REPO" "$REF"; cat scripts/sync-skills.sh; } | base64 -w0 )
          flyctl ssh console -a "$FLY_APP" -C "sh -c \"echo $B64 | base64 -d | sh\""
      - name: Verify published revision
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          got=$(flyctl ssh console -a "$FLY_APP" -C "cat /opt/data/skills-repo/.revision" | tr -d '\r\n ')
          want=$(git rev-parse --short HEAD)
          echo "published=$got expected=$want"
          [ "$got" = "$want" ]
